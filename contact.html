<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ST AUGUSTINE INTERNATIONAL SCHOOL</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">my website</div>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>

    <div class="register-container">
        <section class="register-section">
            <form class="contact-form" action="submit_form.php" method="POST">
                <h2>Contact St. Augustine International School</h2>
                <p><strong>Phone:</strong> 077748346473</p>
                <p><strong>Email:</strong> info@staugustine.com</p>

                <label for="name">Student / Parent Name:</label>
                <input type="text" id="name" name="name" required placeholder="JULIO CITY">

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="student@staugustine.com">

                <label for="subject">Inquiry Type:</label>
                <select id="subject" name="subject" required>
                    <option value="">Select an option</option>
                    <option value="general">General Inquiry</option>
                    <option value="admissions">Admissions</option>
                    <option value="feedback">Feedback</option>
                </select>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit" class="btn-register">Submit Message</button>
            </form>
        </section>
    </div>
</body>
</html>
